[project]
name = "matching-engine"
version = "0.1.0"
description = "Matching engine simples, em memória, para um único ativo, com prioridade preço-tempo."
readme = "README.md"
authors = [{ name = "Mateus Henrique" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
matching-engine = "matching_engine.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PT", "C4", "PL",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos do português são intencionais
    "PLR2004",                     # números mágicos são comuns em testes
    "N818",                        # exceções com nome em português (ErroDeOrdem)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["matching_engine", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
